name: fgv-revival-web

services:
  revival-web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/caddy-root.crt
      BETTER_AUTH_URL: http://localhost:3001
      KEYCLOAK_ISSUER: https://auth.fgv.local.nu:8443/auth/realms/fgv
      API_GRAPHQL_ENDPOINT: ${REVIVAL_API_GRAPHQL_ENDPOINT:-http://revival-api:8080/api/graphql}
      UMAMI_URL: http://umami-server:3000
    env_file:
      - .env
      - .env.local
    extra_hosts:
      - "auth.fgv.local.nu:host-gateway"
      - "host.docker.internal:host-gateway"
    restart: on-failure
    healthcheck:
      test: [ "CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/auth/ok" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "3001:3000"
    volumes:
      - ${INFRA_DEPLOY:-../fgv-infra-deploy}/local/.docker/caddy/data/caddy/pki/authorities/local/root.crt:/usr/local/share/ca-certificates/caddy-root.crt:ro
    networks:
      - fgv

networks:
  fgv:
    name: fgv-local
    external: true
